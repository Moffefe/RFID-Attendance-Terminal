<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title description">
  <title id="title">RFID attendance terminal controller connections</title>
  <desc id="description">The ATmega328P scans the keypad on A5, A4, A3, A2 and D4 through D7, and uses SPI for the RFID reader with D9 as chip select and D8 as reset. It sends input events over a serial link to the ESP8266. The ESP8266 shares I²C between the LCD at address 0x3F and the DS3231 clock. It selects the SD card on a separate SPI bus with GPIO16.</desc>
  <defs>
    <style>
      .text { font-family: 'Segoe UI', Arial, sans-serif; fill: #193b36; }
      .title { font-size: 51px; font-weight: 700; }
      .sub { font-size: 25px; fill: #425e55; }
      .module { font-size: 28px; font-weight: 650; }
      .role { font-size: 21px; fill: #49635a; }
      .pin { font: 600 22px Consolas, 'Liberation Mono', monospace; fill: #153e35; }
      .bus { font-size: 23px; font-weight: 650; }
      .small { font-size: 21px; fill: #50675f; }
      .board { fill: #204a43; stroke: #163832; stroke-width: 2; }
      .boardName { font-size: 37px; font-weight: 650; fill: #fff9ef; }
      .boardRole { font-size: 22px; fill: #d5e7de; }
      .boardIcon { fill: none; stroke: #bdd8ca; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.5; }
      .card { fill: #fffdf6; stroke: #aebfb3; stroke-width: 2; }
      .icon { fill: none; stroke: #305f51; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .wire { fill: none; stroke: #34776a; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
      .terminal { fill: #faf7ee; stroke: #34776a; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1440" height="800" fill="#faf7ee"/>
  <g class="text">
    <text class="title" x="52" y="78">Terminal connections</text>
    <text class="sub" x="54" y="121">From the front-panel inputs to the clock, display and event storage.</text>
    <path d="M52 153H1388" stroke="#c4cfc2" stroke-width="2"/>

    <g id="serial-link">
      <path d="M543 264H882" fill="none" stroke="#a35732" stroke-width="4" stroke-linecap="round"/>
      <path d="M879 256l12 8-12 8" fill="none" stroke="#a35732" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="bus" fill="#8b4729" text-anchor="middle" x="717" y="245">Serial link</text>
      <text class="small" text-anchor="middle" x="717" y="302">Badge and key events</text>
    </g>

    <g id="input-controller">
      <rect class="board" x="145" y="198" width="400" height="130" rx="17"/>
      <g class="boardIcon" transform="translate(168 231)">
        <rect x="9" y="9" width="47" height="47" rx="5"/><circle cx="21" cy="21" r="2.4" fill="#bdd8ca" stroke="none"/>
        <path d="M18 2v7m10-7v7m10-7v7m10-7v7M18 56v7m10-7v7m10-7v7m10-7v7M2 18h7m-7 10h7m-7 10h7m-7 10h7M56 18h7m-7 10h7m-7 10h7m-7 10h7"/>
      </g>
      <text class="boardName" x="251" y="255">ATmega328P</text>
      <text class="boardRole" x="253" y="292">Badge and keypad input</text>
    </g>
    <g id="main-controller">
      <rect class="board" x="893" y="198" width="400" height="130" rx="17"/>
      <g class="boardIcon" transform="translate(915 229)">
        <rect x="2" y="4" width="60" height="63" rx="5"/>
        <path d="M10 17h10V9h10v8h11V9h11v8h4"/>
        <rect x="13" y="29" width="38" height="25" rx="3"/>
        <path d="M12 61h4m7 0h4m7 0h4m7 0h4"/>
      </g>
      <text class="boardName" x="997" y="255">ESP8266</text>
      <text class="boardRole" x="999" y="292">Clock, display and storage</text>
    </g>

    <g id="peripheral-buses">
      <path class="wire" d="M252 328V386H182V470 M438 328V386H476V470"/>
      <path class="wire" d="M985 328V386 M762 470V386H1017V470"/>
      <circle cx="985" cy="386" r="5.5" fill="#34776a"/>
      <path class="wire" d="M1196 328V386H1272V470"/>
      <g class="bus" fill="#305f51" text-anchor="middle">
        <text x="182" y="367">Matrix</text>
        <text x="478" y="367">SPI</text>
        <text x="869" y="367">I²C</text>
        <text x="1273" y="367">SPI</text>
      </g>
    </g>

    <g id="keypad">
      <rect class="card" x="46" y="470" width="272" height="244" rx="15"/>
      <g class="icon" transform="translate(70 488)">
        <rect x="1" y="0" width="46" height="46" rx="6"/>
        <path d="M13 7v32m11-32v32m11-32v32M7 12h34M7 23h34M7 34h34" stroke-width="1.9"/>
      </g>
      <text class="module" x="70" y="568">4 × 4 keypad</text>
      <text class="role" x="70" y="607">Group lines</text>
      <text class="pin" x="70" y="633">A5  A4  A3  A2</text>
      <text class="role" x="70" y="668">Sense lines</text>
      <text class="pin" x="70" y="694">D4  D5  D6  D7</text>
    </g>
    <g id="rfid-reader">
      <rect class="card" x="336" y="470" width="280" height="244" rx="15"/>
      <g class="icon" transform="translate(361 491)">
        <rect x="1" y="1" width="55" height="38" rx="5" fill="#e5eee2"/>
        <path d="M47 34V8H8v24h34V13H13v14h24V18H18v4h13" stroke="#a15b34" stroke-width="2.5"/>
      </g>
      <text class="module" x="361" y="568">RFID reader</text>
      <text class="role" x="361" y="607">Chip select</text>
      <text class="pin" x="361" y="633">D9 · SS</text>
      <text class="role" x="361" y="668">Reset</text>
      <text class="pin" x="361" y="694">D8 · RST</text>
    </g>
    <g id="character-display">
      <rect class="card" x="644" y="470" width="236" height="244" rx="15"/>
      <g class="icon" transform="translate(668 492)">
        <rect x="1" y="1" width="61" height="35" rx="4"/>
        <rect x="7" y="7" width="49" height="23" rx="2" fill="#d3e3b0" stroke-width="1.6"/>
        <path d="M14 13h15m5 0h11m-31 7h9m5 0h14" stroke-width="1.8"/>
      </g>
      <text class="module" x="668" y="568">20 × 4 LCD</text>
      <text class="role" x="668" y="607">I²C address</text>
      <text class="pin" x="668" y="633">0x3F</text>
    </g>
    <g id="real-time-clock">
      <rect class="card" x="900" y="470" width="234" height="244" rx="15"/>
      <g class="icon" transform="translate(924 490)">
        <circle cx="23" cy="22" r="20"/>
        <path d="M23 9v13l10 6M23 3v3m18 16h-3M23 41v-3M4 22h3"/>
      </g>
      <text class="module" x="924" y="568">DS3231</text>
      <text class="role" x="924" y="607">Real-time clock</text>
      <text class="role" x="924" y="665">Maintains time</text>
      <text class="role" x="924" y="691">between restarts.</text>
    </g>
    <g id="sd-storage">
      <rect class="card" x="1154" y="470" width="236" height="244" rx="15"/>
      <g class="icon" transform="translate(1179 488)">
        <path d="M4 44V11L15 1h21a3 3 0 0 1 3 3v40z" fill="#e5eee2"/>
        <path d="M17 6v9m6-9v9m6-9v9m6-9v9M10 26h21m-21 7h14" stroke-width="2"/>
      </g>
      <text class="module" x="1179" y="568">SD card</text>
      <text class="role" x="1179" y="607">Chip select</text>
      <text class="pin" x="1179" y="633">GPIO16 · CS</text>
    </g>

    <g class="terminal">
      <circle cx="182" cy="470" r="5"/><circle cx="476" cy="470" r="5"/>
      <circle cx="762" cy="470" r="5"/><circle cx="1017" cy="470" r="5"/><circle cx="1272" cy="470" r="5"/>
    </g>
    <path d="M52 749H1388" stroke="#c4cfc2" stroke-width="2"/>
    <text class="small" x="54" y="782">Pin names follow the Arduino labels on the ATmega328P and the GPIO numbers on the ESP8266.</text>
  </g>
</svg>
